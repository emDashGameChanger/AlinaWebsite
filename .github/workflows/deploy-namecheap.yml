name: Deploy to Namecheap

on:
  push:
    branches: [main]

jobs:
  ftp-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Allowlist: only HTML, CSS and page resources reach the public host.
      # See .github/scripts/stage-site.sh for the exact file types.
      - name: Stage allowlisted site files
        run: bash .github/scripts/stage-site.sh _site

      - name: FTP deploy
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          server-dir: ./
          local-dir: ./_site/
